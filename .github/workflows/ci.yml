name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the older run's result
# is about to be irrelevant anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint and types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # No setup-python step. uv reads requires-python from pyproject.toml and
      # fetches that interpreter itself, so bumping the required version needs
      # no change here.

      # --locked fails if pyproject.toml and uv.lock have drifted apart,
      # rather than quietly resolving something different from what a
      # contributor would get.
      - name: Sync dependencies
        run: uv sync --locked

      # Network-marked tests are excluded by addopts in pyproject.toml, so this
      # job never touches an upstream server.
      - name: Tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy callsigns
